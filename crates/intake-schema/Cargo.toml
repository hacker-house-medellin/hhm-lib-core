[package]
name = "hhm-intake-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generated SeaORM entities for the HHaus intake schema"
publish = false

[dependencies]
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "with-chrono", "with-uuid"] }
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

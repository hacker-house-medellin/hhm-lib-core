[package]
name = "hhm-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tenant-, user-, and service-scoped SeaORM persistence for Hacker House Medellín"

[dependencies]
chrono = "0.4"
hhm-interfaces = { git = "https://github.com/hacker-house-medellin/hhm-interfaces", rev = "b66988b856946ff028085323ff502796b97e0012" }
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid"] }
uuid = "1"

[dev-dependencies]
sea-orm = { version = "=2.0.2", default-features = false, features = ["mock", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid"] }
tokio = { version = "1", features = ["macros", "rt"] }

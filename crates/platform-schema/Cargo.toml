[package]
name = "hhm-platform-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compile witness for immutable HHaus platform contract projections"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2", default-features = false, features = ["postgres_backend", "uuid", "chrono", "serde_json"] }
diesel-derive-enum = { version = "2", features = ["postgres"] }
sea-orm = { version = "1", default-features = false, features = ["macros", "postgres-array", "with-uuid", "with-chrono", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

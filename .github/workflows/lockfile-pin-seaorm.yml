name: Temporary SeaORM macro compatibility pin

on:
  pull_request:
    paths:
      - Cargo.lock
      - '.github/workflows/lockfile-pin-seaorm.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
      - name: Keep SeaORM 2.0.2 compatible generated APIs
        run: |
          cargo +1.88.0 update -p sea-orm-arrow --precise 2.0.0-rc.4
          cargo +1.88.0 update -p sea-orm-macros --precise 2.0.2
      - name: Emit verified resolver output
        run: |
          printf '%s\n' 'HHM_LOCKFILE_BEGIN'
          base64 Cargo.lock
          printf '%s\n' 'HHM_LOCKFILE_END'

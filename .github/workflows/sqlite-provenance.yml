name: Temporary SQLite feature provenance

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**/Cargo.toml'
      - '.github/workflows/sqlite-provenance.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
      - name: Print SQLite dependency paths and enabling features
        run: |
          cargo +1.88.0 tree --locked -i libsqlite3-sys -e features
          cargo +1.88.0 tree --locked -i sqlx-sqlite -e features

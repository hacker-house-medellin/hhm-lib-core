name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Verify declarative and generated intake schemas
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hhm_schema_authority
          createdb -h 127.0.0.1 -U postgres hhm_schema_migration
          scripts/verify-intake-schema.sh \
            postgres://postgres:postgres@127.0.0.1/hhm_schema_authority \
            schema/schema.sql
          scripts/verify-intake-schema.sh \
            postgres://postgres:postgres@127.0.0.1/hhm_schema_migration \
            migrations/202608300001_hhm_intake.sql
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: ./scripts/test.sh
      - run: ./scripts/check-secret-diff.sh "$TRUSTED_BASE_SHA"
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

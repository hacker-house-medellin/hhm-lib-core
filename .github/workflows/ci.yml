name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out immutable production platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hacker-house-medellin/hhm-interfaces
          ref: b66988b856946ff028085323ff502796b97e0012
          path: target/hhm-interfaces-platform-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - name: Verify intake and platform schemas on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres hhm_schema_authority
          createdb -h 127.0.0.1 -U postgres hhm_schema_migration
          createdb -h 127.0.0.1 -U postgres hhm_platform_contract
          scripts/verify-intake-schema.sh \
            postgres://postgres:postgres@127.0.0.1/hhm_schema_authority \
            schema/schema.sql
          scripts/verify-intake-schema.sh \
            postgres://postgres:postgres@127.0.0.1/hhm_schema_migration \
            migrations/202608300001_hhm_intake.sql \
            migrations/202608310001_hhm_application_placement.sql
          scripts/verify-platform-schema.sh \
            postgres://postgres:postgres@127.0.0.1/hhm_platform_contract
      - name: Verify vendored platform artifacts against the immutable source
        run: >-
          python3 scripts/verify-platform-vendor.py
          --source target/hhm-interfaces-platform-source
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: ./scripts/test.sh
      - run: ./scripts/check-secret-diff.sh "$TRUSTED_BASE_SHA"
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  admin-orm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hhm_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hhm_admin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Apply declarative admin schema
        env:
          PGPASSWORD: postgres
        run: >-
          psql postgresql://postgres@127.0.0.1/hhm_admin_test
          -X --set ON_ERROR_STOP=1
          --file admin-orm/schema/admin-db-contract.sql
      - name: Test admin ORM lease state machine
        working-directory: admin-orm
        env:
          HHM_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/hhm_admin_test
        run: |
          cargo +1.88.0 fmt --all -- --check
          cargo +1.88.0 clippy --all-targets --locked -- -D warnings
          cargo +1.88.0 test --all-targets --locked

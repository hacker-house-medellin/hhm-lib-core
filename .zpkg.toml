[package]
org = "hacker-house-medellin"
name = "hhm-lib-core"
version = "0.1.0"
description = "Shared contracts and runtime-light libraries for Hacker House Medellín"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-lib-core"

[install]
dir = ".vendor/.zed"

[dependencies]
# Cargo.lock and immutable Cargo Git revisions remain authoritative until the
# corresponding Zed artifacts are published.

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"

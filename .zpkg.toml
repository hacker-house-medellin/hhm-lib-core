[package]
org = "hacker-house-medellin"
name = "hhm-lib-core"
version = "0.1.0"
description = "Shared contracts and scoped SeaORM persistence for Hacker House Medellín"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-lib-core"

[install]
dir = ".vendor/.zed"

[dependencies]
# Cargo pins hhm-interfaces to reviewed immutable revision
# 4079822762f23d014fe0dd8d138b823c0c0758e5. Keep that edge solely under
# Cargo.lock authority until the matching Zed artifact is published and the
# resolver can record it here and in .zpkg.lock together.

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
